<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AmorWa – Discover</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="page-app">

  <header class="app-header">
    <button id="settingsBtn" class="icon-btn" title="Filters">⚙️</button>
    <div class="settings-menu" id="settingsMenu">

  <button onclick="logoutUser()" data-i18n="logout">
    Logout
  </button>

  <button onclick="deleteAccount()" class="danger-btn" data-i18n="deleteAccount">
    Delete Account
  </button>

</div>
    <div class="logo-mark">AmorWa</div>
    <div class="top-actions">
      <button class="lang-btn" id="langToggle">🌐 <span id="langLabel">EN</span></button>
      <button class="theme-btn" id="themeToggle">🌙</button>
    </div>
  </header>

  <main class="swipe-main">
    <!-- Card stack -->
    <div class="card-stack" id="cardStack">
      <!-- Cards rendered by JS -->
    </div>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="empty-icon">💤</div>
      <h3 data-i18n="noMore">No more profiles!</h3>
      <p data-i18n="checkBack">Check back later for more matches.</p>
      <button class="btn btn-primary" onclick="resetCards()" data-i18n="refresh">Refresh</button>
    </div>

    <!-- Action buttons -->
    <div class="swipe-actions" id="swipeActions">
      <button class="action-btn pass-btn" id="passBtn" title="Pass">
        <span>✕</span>
      </button>

    
</button>
      <button class="action-btn super-btn" title="Super Like">
        <span>⭐</span>
      </button>
      <button class="action-btn like-btn" id="likeBtn" title="Like">
        <span>♥</span>
      </button>
    </div>
  </main>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <a href="swipe.html" class="nav-item active">
      <span class="nav-icon">🔥</span>
      <span class="nav-label" data-i18n="discover">Discover</span>
    </a>
    <a href="match.html" class="nav-item">
      <span class="nav-icon">💬</span>
      <span class="nav-label" data-i18n="matches">Matches</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span class="nav-label" data-i18n="profile">Profile</span>
    </a>
  </nav>

  <div class="report-modal" id="reportModal">

  <div class="report-box">

    <h3>Report User</h3>

    <p>Select a reason:</p>

    <select id="reportReason">

      <option value="">Choose reason</option>

      <option value="Harassment">Harassment</option>

      <option value="Fake Profile">Fake Profile</option>

      <option value="Spam">Spam</option>

      <option value="Nudity">Nudity</option>

      <option value="Scammer">Scammer</option>

      <option value="Hate Speech">Hate Speech</option>

      <option value="Violence">Violence</option>

      <option value="Underage User">Underage User</option>

      <option value="Other">Other</option>

    </select>

    <textarea
      id="reportDetails"
      placeholder="Additional details (optional)"
    ></textarea>

    <div class="report-actions">

      <button onclick="closeReportModal()">
        Cancel
      </button>

      <button onclick="submitReport()">
        Submit Report
      </button>

    </div>

  </div>

</div>

  <script type="module" src="script.js"></script>
   <script type="module" src="profile.js"></script>
</body>
</html>
