<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AmorWa – Find Your Match in Rwanda</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="page-welcome">

  <!-- Top bar -->
  <header class="top-bar">
    <div class="logo-mark">AmorWa</div>
    <div class="top-actions">
      <button class="lang-btn" id="langToggle" title="Language">🌐 <span id="langLabel">EN</span></button>
      <button class="theme-btn" id="themeToggle" title="Toggle theme">🌙</button>
    </div>
  </header>

  <!-- Hero -->
  <main class="welcome-hero">
    <div class="hero-glow"></div>
    <div class="hero-content">
      <div class="app-badge" data-i18n="badge">Rwanda's #1 Dating App</div>
      <h1 class="hero-title">
        <span data-i18n="hero1">Find Love,</span><br/>
        <em data-i18n="hero2">Find Connection</em>
      </h1>
      <p class="hero-sub" data-i18n="heroSub">Join thousands of Rwandans finding meaningful relationships every day.</p>

      <div class="hero-cards-preview">
        <div class="preview-card c1">
          <div class="pc-img" style="background: linear-gradient(135deg,#e879a0,#9b59b6)"></div>
          <div class="pc-info"><strong>Amara</strong><span>24</span></div>
        </div>
        <div class="preview-card c2 active">
          <div class="pc-img" style="background: linear-gradient(135deg,#6c63ff,#e879a0)"></div>
          <div class="pc-info"><strong>Claudine</strong><span>22</span></div>
        </div>
        <div class="preview-card c3">
          <div class="pc-img" style="background: linear-gradient(135deg,#f093fb,#f5576c)"></div>
          <div class="pc-info"><strong>Nathalie</strong><span>26</span></div>
        </div>
      </div>

      <div class="hero-cta">
        <a href="register.html" class="btn btn-primary" data-i18n="getStarted">Get Started</a>
        <a href="login.html" class="btn btn-ghost" data-i18n="login">Log In</a>
      </div>

      <p class="hero-foot" data-i18n="heroFoot">Free to join • Trusted • Private</p>
    </div>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
